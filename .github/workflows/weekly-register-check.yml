name: Weekly register check

# Two things happen here, and only one of them touches the repo:
#   validate  runs on every push and every week. Fails if register.json
#             would break the feed the evaluation tool reads.
#   watch     runs weekly. Polls the gov.uk pages listed in sources.json,
#             and raises an issue when one of them actually changes.
#
# Nothing edits register.json. A bot must not rewrite a compliance register,
# because a bad edit surfaces as a wrong gap report rather than as an alert.

on:
  schedule:
    # 07:00 UTC every Monday. Cron on GitHub is UTC and can run late under
    # load, so do not rely on it being punctual.
    - cron: "0 7 * * 1"
  workflow_dispatch: {}
  push:
    paths:
      - "register.json"
      - "sources.json"
      - "scripts/**"
      - ".github/workflows/weekly-register-check.yml"

permissions:
  contents: write   # to commit sources.state.json
  issues: write     # to raise the change notice

concurrency:
  group: register-check
  cancel-in-progress: false

jobs:
  validate:
    name: Validate register.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate
        run: python3 scripts/validate_register.py --file register.json --report validate-report.md

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validate-report
          path: validate-report.md
          if-no-files-found: warn

  watch:
    name: Watch gov.uk sources
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the sources
        id: watch
        run: python3 scripts/watch_sources.py --sources sources.json --state sources.state.json --report watch-report.md

      - name: Record what was seen
        run: |
          if [ -n "$(git status --porcelain sources.state.json)" ]; then
            git config user.name  "register-watcher"
            git config user.email "register-watcher@users.noreply.github.com"
            git add sources.state.json
            git commit -m "chore: record source timestamps $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No timestamp changes to record."
          fi

      - name: Raise a change notice
        if: steps.watch.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Register review needed — ${{ steps.watch.outputs.count }} source change(s), $(date -u +%Y-%m-%d)" \
            --body-file watch-report.md \
            --label "register-review" || \
          gh issue create \
            --title "Register review needed — ${{ steps.watch.outputs.count }} source change(s), $(date -u +%Y-%m-%d)" \
            --body-file watch-report.md
          # The second call is the fallback for a repo where the label does
          # not exist yet. Create a "register-review" label once and the
          # fallback stops being used.

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watch-report
          path: watch-report.md
          if-no-files-found: warn
